[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelagent"
version = "0.1.0"
description = "本地优先的长篇小说创作 Agent 框架。"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
novelagent = "novelagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
